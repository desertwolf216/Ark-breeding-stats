<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARK Breeding Stats</title>

<style>
:root{
--bg:#0b1117;
--card:#121c25;
--line:#273847;
--text:#eef5fa;
--muted:#8fa3b4;
--accent:#52d7b0
}

*{box-sizing:border-box}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:system-ui,-apple-system,sans-serif
}

header{
position:sticky;
top:0;
z-index:5;
background:#0b1117ee;
backdrop-filter:blur(12px);
padding:16px;
border-bottom:1px solid var(--line)
}

.wrap{max-width:850px;margin:auto}

h1{
font-size:21px;
margin:0 0 12px
}

input,button{font:inherit}

.search{
width:100%;
padding:13px;
background:#080d12;
color:white;
border:1px solid var(--line);
border-radius:11px;
font-size:16px
}

main{padding:14px}

.toolbar{
display:flex;
gap:8px;
margin-bottom:12px
}

button{
border:1px solid var(--line);
border-radius:10px;
background:#17232d;
color:white;
padding:10px 13px;
font-weight:700
}

.primary{
background:var(--accent);
color:#06110e;
border:0
}

.list{
display:grid;
gap:8px
}

.creature{
background:var(--card);
border:1px solid var(--line);
border-radius:12px;
padding:14px;
cursor:pointer;
display:flex;
justify-content:space-between;
align-items:center
}

.creature small{color:var(--muted)}

.saved{
color:var(--accent);
font-size:12px
}

#editor{display:none}

.back{margin-bottom:12px}

.panel{
background:var(--card);
border:1px solid var(--line);
border-radius:14px;
padding:14px
}

.stathead,.statrow{
display:grid;
grid-template-columns:1.2fr .65fr 1fr;
gap:9px;
align-items:center
}

.stathead{
color:var(--muted);
font-size:12px;
padding:4px 0 8px
}

.statrow{
padding:8px 0;
border-top:1px solid var(--line)
}

.statrow input{
width:100%;
background:#080d12;
color:white;
border:1px solid var(--line);
border-radius:9px;
padding:11px;
text-align:right
}

.statname{font-weight:700}

.actions{
display:flex;
gap:8px;
margin-top:14px
}

.note{
color:var(--muted);
font-size:12px;
line-height:1.4
}

@media(max-width:500px){
.stathead,.statrow{
grid-template-columns:1fr 70px 115px
}
}
</style>
</head>

<body>

<header>
<div class="wrap">
<h1>ARK Breeding Stats</h1>
<input id="q" class="search" placeholder="Search creatures…" oninput="render()">
</div>
</header>

<main class="wrap">

<section id="browser">

<div class="toolbar">
<button class="primary" onclick="addCreature()">+ Add modded creature</button>
<button onclick="showSaved()">Saved only</button>
</div>

<div id="count" class="note" style="margin-bottom:10px"></div>
<div id="list" class="list"></div>

</section>

<section id="editor">

<button class="back" onclick="closeEditor()">← All creatures</button>

<div class="panel">

<h2 id="title" style="margin-top:0"></h2>

<div class="stathead">
<span>Stat</span>
<span>Points</span>
<span>Value</span>
</div>

<div id="rows"></div>

<div class="actions">
<button class="primary" onclick="saveCurrent()">Save stats</button>
<button onclick="clearCurrent()">Clear</button>
</div>

<p class="note">
Values are saved on this iPad in Safari. Melee can be entered as the percentage shown in-game.
</p>

</div>
</section>

</main>

<script>

const DEFAULTS=[
"Achatina","Acrocanthosaurus","Allosaurus","Alpha Basilisk",
"Alpha Carnotaurus","Alpha Deathworm","Alpha Fire Wyvern",
"Alpha Karkinos","Alpha Leedsichthys","Alpha Megalodon",
"Alpha Mosasaur","Alpha Raptor","Alpha Rex","Alpha Tusoteuthis",
"Amargasaurus","Ammonite","Andrewsarchus","Anglerfish",
"Ankylosaurus","Araneo","Archaeopteryx","Archelon","Argentavis",
"Arthropluera","Astrocetus","Astrodelphis","Baryonyx","Basilisk",
"Basilosaurus","Beelzebufo","Beyla","Bison","Bloodstalker",
"Boaratos","Brontosaurus","Broodmother Lysrix","Bulbdog",
"Bunny Dodo","Carbonemys","Carcharodontosaurus","Carnotaurus",
"Castoroides","Cat","Ceratosaurus","Chalicotherium","Cnidaria",
"Coelacanth","Compy","Concavenator","Corrupted Master Controller",
"Cosmo","Cryolophosaurus","Crystal Wyvern Queen","Daeodon",
"Deathworm","Deinonychus","Deinosuchus","Deinotherium",
"Desert Titan","Desmodus","Dilophosaur","Dimetrodon","Dimorphodon",
"Dinopithecus King","Diplocaulus","Diplodocus","Dire Bear",
"Direwolf","Dodo","Dodorex","Dodowyvern","Doedicurus","Dragon",
"Dreadnoughtus","Dunkleosteus","Electrophorus","Equus","Eurypterid",
"Fasolasuchus","Featherlight","Fenrisúlfr","Ferox","Fire Wyvern",
"Fjordhawk","Forest Titan","Gacha","Gallimimus","Gasbags",
"Giant Bee","Giganotosaurus","Gigantopithecus","Gigantoraptor",
"Glowbug","Glowtail","Grand Tortugar","Griffin","Hati",
"Hesperornis","Hyaenodon","Ice Titan","Ice Wyvern","Ichthyornis",
"Ichthyosaurus","Iguanodon","Jerboa","Kairuku","Kaprosuchus",
"Karkinos","Kentrosaurus","King Titan","Lamprey","Leech",
"Leedsichthys","Lightning Wyvern","Liopleurodon","Lymantria",
"Maeguana","Maewing","Magmasaur","Mammoth","Managarmr","Manta",
"Manticore","Mantis","Megachelon","Megalania","Megaloceros",
"Megalodon","Megalosaurus","Meganeura","Megapithecus","Megatherium",
"Mesopithecus","Microraptor","Moeder","Morellatops","Mosasaurus",
"Moschops","Nameless","Noglin","Onyc","Otter","Overseer","Ovis",
"Pachy","Pachyrhinosaurus","Paraceratherium","Parasaur",
"Pegomastax","Pelagornis","Phiomia","Phoenix","Plesiosaur",
"Poison Wyvern","Procoptodon","Pteranodon","Pulmonoscorpius",
"Purlovia","Quetzal","Raptor","Ravager","Reaper King","Reaper Queen",
"Rex","Rhyniognatha","Rock Drake","Rock Elemental","Rockwell",
"Roll Rat","Sabertooth","Sabertooth Salmon","Sarco","Scout",
"Seeker","Shadowmane","Shastasaurus","Shinehorn","Sinomacrops",
"Sköll","Snow Owl","Spino","Stegosaurus","Steinbjörn",
"Tek Parasaur","Tek Quetzal","Tek Raptor","Tek Rex","Tek Stegosaurus",
"Tek Stryder","Terror Bird","Therizinosaur","Thorny Dragon",
"Thylacoleo","Titanoboa","Titanomyrma","Titanosaur","Triceratops",
"Trilobite","Troodon","Tropeognathus","Turkey","Tusoteuthis",
"Unicorn","Velonasaur","Voidwyrm","Vulture","Woolly Rhino",
"Wyvern","Xiphactinus","Yi Ling","Yutyrannus"
];

const STATS=[
["health","Health"],
["stamina","Stamina"],
["oxygen","Oxygen"],
["food","Food"],
["weight","Weight"],
["melee","Melee Damage"]
];

let custom=JSON.parse(
localStorage.getItem("arkCustomCreatures")||"[]"
);

let db=JSON.parse(
localStorage.getItem("arkBreedingStats")||"{}"
);

let current=null;
let savedOnly=false;

function all(){
return [...new Set([...DEFAULTS,...custom])]
.sort((a,b)=>a.localeCompare(b));
}

function render(){

let query=(q.value||"").toLowerCase();

let a=all().filter(
n=>n.toLowerCase().includes(query)
);

if(savedOnly){
a=a.filter(
n=>db[n]&&Object.values(db[n])
.some(x=>x.points||x.value)
);
}

count.textContent=
`${a.length} creature${a.length===1?"":"s"}`;

list.innerHTML=a.map(n=>`
<div class="creature"
onclick='openCreature(${JSON.stringify(n)})'>

<div>
<b>${esc(n)}</b><br>
<small>
${custom.includes(n)?"Modded / custom":"ARK creature"}
</small>
</div>

${db[n]?
"<span class=saved>Saved ✓</span>"
:""}

</div>
`).join("");

}

function esc(s){

return s.replace(
/[&<>"]/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;"
}[m])
);

}

function openCreature(n){

current=n;
title.textContent=n;

let d=db[n]||{};

rows.innerHTML=STATS.map(([k,label])=>`

<div class="statrow">

<div class="statname">
${label}
</div>

<input
inputmode="numeric"
id="${k}p"
placeholder="0"
value="${d[k]?.points??""}">

<input
inputmode="decimal"
id="${k}v"
placeholder="${k==="melee"?"%":"0"}"
value="${d[k]?.value??""}">

</div>

`).join("");

browser.style.display="none";
editor.style.display="block";

scrollTo(0,0);

}

function closeEditor(){

editor.style.display="none";
browser.style.display="block";

current=null;

render();

}

function saveCurrent(){

let d={};

STATS.forEach(([k])=>{

d[k]={
points:document.getElementById(k+"p").value,
value:document.getElementById(k+"v").value
};

});

db[current]=d;

localStorage.setItem(
"arkBreedingStats",
JSON.stringify(db)
);

alert("Saved");

closeEditor();

}

function clearCurrent(){

if(confirm(
"Clear all saved stats for "+current+"?"
)){

delete db[current];

localStorage.setItem(
"arkBreedingStats",
JSON.stringify(db)
);

openCreature(current);

}

}

function addCreature(){

let n=prompt(
"Modded creature name:"
);

if(!n)return;

n=n.trim();

if(!n)return;

if(
!custom.includes(n)&&
!DEFAULTS.includes(n)
){

custom.push(n);

localStorage.setItem(
"arkCustomCreatures",
JSON.stringify(custom)
);

}

q.value=n;
savedOnly=false;

render();

}

function showSaved(){

savedOnly=!savedOnly;

render();

}

render();

</script>

</body>
</html>
