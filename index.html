<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARK Breeding Stats</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #0b1117;
  color: white;
}

header {
  position: sticky;
  top: 0;
  z-index: 10;
  padding: 16px;
  background: #101922;
  border-bottom: 1px solid #293846;
}

.container {
  max-width: 800px;
  margin: auto;
}

h1 {
  margin: 0 0 12px;
  font-size: 22px;
}

input {
  font-size: 16px;
}

#search {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #344757;
  background: #080d12;
  color: white;
}

main {
  max-width: 800px;
  margin: auto;
  padding: 14px;
}

.toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

button {
  padding: 11px 14px;
  border-radius: 9px;
  border: 1px solid #344757;
  background: #17242e;
  color: white;
  font-weight: 600;
  cursor: pointer;
}

button.primary {
  background: #51d6ae;
  color: #06110d;
  border: none;
}

#creatureList {
  display: grid;
  gap: 8px;
}

.creature {
  padding: 15px;
  background: #121c25;
  border: 1px solid #293846;
  border-radius: 11px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.creature:active {
  background: #1a2935;
}

.creature-name {
  font-weight: 700;
}

.saved {
  color: #51d6ae;
  font-size: 13px;
}

#editor {
  display: none;
}

.panel {
  padding: 15px;
  background: #121c25;
  border: 1px solid #293846;
  border-radius: 12px;
}

.stat-header,
.stat-row {
  display: grid;
  grid-template-columns: 1fr 80px 125px;
  gap: 8px;
  align-items: center;
}

.stat-header {
  color: #8fa3b4;
  font-size: 12px;
  padding-bottom: 8px;
}

.stat-row {
  border-top: 1px solid #293846;
  padding: 9px 0;
}

.stat-name {
  font-weight: 600;
}

.stat-row input {
  width: 100%;
  padding: 12px 8px;
  text-align: right;
  border-radius: 8px;
  border: 1px solid #344757;
  background: #080d12;
  color: white;
}

.actions {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.note {
  color: #8fa3b4;
  font-size: 12px;
}

@media (max-width: 500px) {
  .stat-header,
  .stat-row {
    grid-template-columns: 1fr 65px 105px;
  }
}
</style>
</head>

<body>

<header>
<div class="container">

<h1>ARK Breeding Stats</h1>

<input
  id="search"
  type="search"
  placeholder="Search creatures..."
>

</div>
</header>

<main>

<div id="browser">

<div class="toolbar">

<button id="addButton" class="primary">
+ Add Creature
</button>

<button id="savedButton">
Saved Only
</button>

</div>

<p id="creatureCount" class="note"></p>

<div id="creatureList"></div>

</div>


<div id="editor">

<button id="backButton">
← All Creatures
</button>

<br><br>

<div class="panel">

<h2 id="creatureTitle"></h2>

<div class="stat-header">
<div>Stat</div>
<div>Points</div>
<div>Value</div>
</div>

<div id="statRows"></div>

<div class="actions">

<button id="saveButton" class="primary">
Save Stats
</button>

<button id="clearButton">
Clear
</button>

</div>

<p class="note">
Stats are saved on this device.
</p>

</div>

</div>

</main>


<script>

"Carcharodontosaurus",
"Carnotaurus",
"Castoroides",
"Cat",
"Ceratosaurus",
"Chalicotherium",
"Compy",
"Concavenator",
"Cosmo",
"Cryolophosaurus",
"Daeodon",

"Dire Bear",
"Direwolf",
"Dodo",
"Doedicurus",
"Dreadnoughtus",
"Dunkleosteus",
"Electrophorus",
"Equus",
"Fasolasuchus",
"Featherlight",
"Ferox",
"Fjordhawk",
"Gallimimus",
"Gacha",
"Gasbags",
"Giant Bee",
"Giganotosaurus",
"Gigantopithecus",
"Gigantoraptor",
"Glowtail",
"Grand Tortugar",
"Griffin",
"Hesperornis",
"Hyaenodon",

"Jerboa",

"Lymantria",
"Maeguana",
"Maewing",
"Magmasaur",
"Mammoth",
"Managarmr",
"Manta",

"Megachelon",
"Megalania",

"Megalodon",

"Rex",

"Roll Rat",

"Snow Owl",
"Spino",

"Tek Parasaur",
"Tek Quetzal",
"Tek Raptor",
"Tek Rex",

"Tek Stryder",
"Terror Bird",
"Therizinosaur",
"Thorny Dragon",
"Thylacoleo",
"Titanosaur",

"Tropeognathus",
"Tusoteuthis",
"Unicorn",
"Velonasaur",
"Voidwyrm",
"Vulture",
"Woolly Rhino",
"Wyvern",
"Fire Wyvern",
"Ice Wyvern",
"Lightning Wyvern",
"Poison Wyvern",
"Xiphactinus",
"Yi Ling",
"Yutyrannus"

];


var statTypes = [

["health","Health"],
["stamina","Stamina"],
["oxygen","Oxygen"],
["food","Food"],
["weight","Weight"],
["melee","Melee Damage"]

];


var customCreatures = [];

var savedStats = {};

var currentCreature = "";

var savedOnly = false;


/* LOAD SAVED DATA */

try {

  customCreatures =
    JSON.parse(
      localStorage.getItem("arkCustomCreatures")
    ) || [];

  savedStats =
    JSON.parse(
      localStorage.getItem("arkBreedingStats")
    ) || {};

}
catch(error) {

  customCreatures = [];
  savedStats = {};

}


/* ELEMENTS */

var search =
  document.getElementById("search");

var creatureList =
  document.getElementById("creatureList");

var creatureCount =
  document.getElementById("creatureCount");

var browser =
  document.getElementById("browser");

var editor =
  document.getElementById("editor");

var creatureTitle =
  document.getElementById("creatureTitle");

var statRows =
  document.getElementById("statRows");


/* GET ALL CREATURES */

function getAllCreatures() {

  var combined =
    creatures.concat(customCreatures);

  var unique = [];

  combined.forEach(function(name) {

    if (unique.indexOf(name) === -1) {
      unique.push(name);
    }

  });

  unique.sort();

  return unique;

}


/* DOES CREATURE HAVE SAVED STATS */

function hasSavedStats(name) {

  if (!savedStats[name]) {
    return false;
  }

  var data = savedStats[name];

  for (var key in data) {

    if (
      data[key].points ||
      data[key].value
    ) {
      return true;
    }

  }

  return false;

}


/* DRAW CREATURE LIST */

function renderCreatures() {

  var query =
    search.value.toLowerCase();

  var all =
    getAllCreatures();

  var filtered =
    all.filter(function(name) {

      var matchesSearch =
        name.toLowerCase()
        .indexOf(query) !== -1;

      var matchesSaved =
        !savedOnly ||
        hasSavedStats(name);

      return (
        matchesSearch &&
        matchesSaved
      );

    });


  creatureCount.textContent =
    filtered.length +
    " creatures";


  creatureList.innerHTML = "";


  filtered.forEach(function(name) {

    var row =
      document.createElement("div");

    row.className = "creature";


    var left =
      document.createElement("div");

    left.className =
      "creature-name";

    left.textContent = name;


    row.appendChild(left);


    if (hasSavedStats(name)) {

      var saved =
        document.createElement("div");

      saved.className = "saved";

      saved.textContent = "Saved ✓";

      row.appendChild(saved);

    }


    row.addEventListener(
      "click",
      function() {

        openCreature(name);

      }
    );


    creatureList.appendChild(row);

  });

}


/* OPEN CREATURE */

function openCreature(name) {

  currentCreature = name;

  creatureTitle.textContent = name;

  statRows.innerHTML = "";

  var existing =
    savedStats[name] || {};


  statTypes.forEach(function(stat) {

    var key = stat[0];
    var label = stat[1];


    var row =
      document.createElement("div");

    row.className =
      "stat-row";


    var statName =
      document.createElement("div");

    statName.className =
      "stat-name";

    statName.textContent =
      label;


    var points =
      document.createElement("input");

    points.type = "number";

    points.inputMode =
      "numeric";

    points.placeholder =
      "0";

    points.id =
      key + "_points";


    if (
      existing[key] &&
      existing[key].points
    ) {

      points.value =
        existing[key].points;

    }


    var value =
      document.createElement("input");

    value.type = "number";

    value.step = "any";

    value.inputMode =
      "decimal";

    value.placeholder =
      key === "melee"
      ? "%"
      : "0";

    value.id =
      key + "_value";


    if (
      existing[key] &&
      existing[key].value
    ) {

      value.value =
        existing[key].value;

    }


    row.appendChild(statName);

    row.appendChild(points);

    row.appendChild(value);

    statRows.appendChild(row);

  });


  browser.style.display =
    "none";

  editor.style.display =
    "block";

  window.scrollTo(0,0);

}


/* SAVE */

function saveStats() {

  if (!currentCreature) {
    return;
  }


  var data = {};


  statTypes.forEach(function(stat) {

    var key = stat[0];


    var points =
      document.getElementById(
        key + "_points"
      ).value;


    var value =
      document.getElementById(
        key + "_value"
      ).value;


    data[key] = {

      points: points,

      value: value

    };

  });


  savedStats[currentCreature] =
    data;


  localStorage.setItem(
    "arkBreedingStats",
    JSON.stringify(savedStats)
  );


  alert(
    currentCreature +
    " stats saved"
  );

}


/* CLEAR */

function clearStats() {

  if (!currentCreature) {
    return;
  }


  var answer =
    confirm(
      "Clear all stats for " +
      currentCreature +
      "?"
    );


  if (!answer) {
    return;
  }


  delete savedStats[currentCreature];


  localStorage.setItem(
    "arkBreedingStats",
    JSON.stringify(savedStats)
  );


  openCreature(
    currentCreature
  );

}


/* BACK */

function goBack() {

  editor.style.display =
    "none";

  browser.style.display =
    "block";

  currentCreature = "";

  renderCreatures();

}


/* ADD MODDED CREATURE */

function addCreature() {

  var name =
    prompt(
      "Enter creature name"
    );


  if (!name) {
    return;
  }


  name =
    name.trim();


  if (!name) {
    return;
  }


  if (
    creatures.indexOf(name) === -1 &&
    customCreatures.indexOf(name) === -1
  ) {

    customCreatures.push(name);


    localStorage.setItem(
      "arkCustomCreatures",
      JSON.stringify(
        customCreatures
      )
    );

  }


  search.value = name;

  savedOnly = false;

  renderCreatures();

}


/* BUTTON EVENTS */

search.addEventListener(
  "input",
  renderCreatures
);


document
.getElementById("addButton")
.addEventListener(
  "click",
  addCreature
);


document
.getElementById("savedButton")
.addEventListener(
  "click",
  function() {

    savedOnly =
      !savedOnly;

    this.textContent =
      savedOnly
      ? "Show All"
      : "Saved Only";

    renderCreatures();

  }
);


document
.getElementById("backButton")
.addEventListener(
  "click",
  goBack
);


document
.getElementById("saveButton")
.addEventListener(
  "click",
  saveStats
);


document
.getElementById("clearButton")
.addEventListener(
  "click",
  clearStats
);


/* INITIAL LOAD */

renderCreatures();

</script>

</body>
</html>
